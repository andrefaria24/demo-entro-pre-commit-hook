name: Entro Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entro-secret-scan:
    runs-on: ubuntu-latest
    env:
      ENTRO_SECURITY_PLATFORM_TOKEN: ${{ secrets.ENTRO_SECURITY_PLATFORM_TOKEN }}
      ENTRO_SECURITY_PLATFORM_URL: ${{ secrets.ENTRO_SECURITY_PLATFORM_URL }}
      # Repository variable. Unset or empty means block. Set to warn for a non-blocking check.
      ENTRO_FAIL_MODE: ${{ vars.ENTRO_FAIL_MODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Entro credentials are configured
        run: |
          missing=0
          for v in ENTRO_SECURITY_PLATFORM_TOKEN ENTRO_SECURITY_PLATFORM_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository secret $v is not set (note: secrets are not exposed to PRs from forks)."
              missing=1
            fi
          done
          exit $missing

      - name: Install Entro CLI 2.0.16
        run: |
          set -e
          # The install script's "latest" pointer is 1.2.3
          curl -fsSL https://public-entro-security.s3.us-east-1.amazonaws.com/entro-cli/install-cli -o /tmp/install-entro-cli
          sh /tmp/install-entro-cli 2.0.16
          echo "Verifying Entro CLI installation..."
          command -v entro
          version="$(entro --version)"
          echo "$version"
          echo "$version" | grep -q '2.0.16'

      - name: Collect files to scan
        run: |
          set -e
          # Scan the whole tree on every run so the dummy credentials are always reported.
          git ls-files > files-to-scan.txt
          echo "Files to scan:"
          sed 's/^/  - /' files-to-scan.txt

      - name: Scan for exposed secrets
        run: |
          chmod +x scripts/entro-ci-scan.sh
          scripts/entro-ci-scan.sh files-to-scan.txt

      - name: Diagnose Entro credentials
        if: failure()
        run: |
          # Prints non-sensitive facts about the credentials this runner received, so they can be compared with the desktop. The token itself is never printed.
          t="$ENTRO_SECURITY_PLATFORM_TOKEN"
          u="$ENTRO_SECURITY_PLATFORM_URL"
          echo "Runner egress IP: $(curl -fsS https://api.ipify.org || echo unknown)"
          echo "Token length:            ${#t}"
          echo "Token whitespace chars:  $(printf '%s' "$t" | tr -cd '[:space:]' | wc -c)"
          echo "Token quote chars:       $(printf '%s' "$t" | tr -cd "\"'" | wc -c)"
          echo "Token sha256 (first 8):  $(printf '%s' "$t" | sha256sum | cut -c1-8)"
          echo "URL length:              ${#u}"
          echo "URL whitespace chars:    $(printf '%s' "$u" | tr -cd '[:space:]' | wc -c)"
          echo "URL host/path (split):   host=$(printf '%s' "$u" | sed -E 's#^[a-z]+://##; s#/.*$##') path=/$(printf '%s' "$u" | sed -E 's#^[a-z]+://[^/]*/?##')"
          for target in "secret-url:$u" "app:https://app.entro.security" "api:https://api.entro.security"; do
            label="${target%%:*}"; url="${target#*:}"
            echo "--- CLI scan with $label URL"
            ENTRO_SECURITY_PLATFORM_URL="$url" entro scan path README.md 2>&1 \
              | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' \
              | grep -E 'Scanned|cause: \{|Authentication failed|token is invalid|Forbidden|invalid' | head -3 || true
          done
